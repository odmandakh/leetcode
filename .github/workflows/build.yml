name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch: # the "Run workflow" button -- triggers the full test-all sweep

jobs:
  conflict-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for unresolved merge-conflict markers
        run: scripts/check-conflicts.sh

  # Automatic on push/PR: only builds+tests problems whose own files changed.
  test-changed:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: conflict-check
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure
        run: cmake -S . -B build

      - name: Build + test changed problems only
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/test-changed.sh "${{ github.event.pull_request.base.sha }}"
          else
            scripts/test-changed.sh "${{ github.event.before }}"
          fi

  # Manual only (Actions tab -> Run workflow): full sweep, slow (~4 min).
  # Run after touching shared files (runner.h, CMakeLists.txt, scripts/*.sh).
  test-all:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: conflict-check
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build

      # Builds every solved problem/contest question with -Wall -Wextra
      # -Wpedantic -Werror (compiler-level correctness checks, from
      # CMakeLists.txt) and runs each one's own tests, catching regressions
      # in shared files (runner.h, CMakeLists.txt, scripts/*.sh templates)
      # that a single "build the active problem" check would miss.
      - name: Build + run every problem's and contest question's own tests
        run: scripts/test-all.sh

  coding-standards:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: conflict-check
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      # Only checks files changed in this push/PR -- new/touched code gets
      # checked, already-solved problems aren't retroactively flagged just
      # for predating this check.
      - name: Check clang-format compliance (changed files only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/check-format.sh "${{ github.event.pull_request.base.sha }}"
          else
            scripts/check-format.sh "${{ github.event.before }}"
          fi
